name: Execute Pytest API Automation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests and generate reports
      if: always()  # Запускать даже если предыдущие шаги упали
      run: |
        # 1. Генерируем HTML-отчет
        # 2. Генерируем Markdown-отчет для GitHub Job Summary
        pytest tests/ -v --html=report.html --self-contained-html --md-report --md-report-flavor gfm --md-report-output summary.md

    - name: Publish Markdown Summary to GitHub Actions
      if: always()
      run: |
        # Отправляем сгенерированную таблицу в сводку GitHub
        cat summary.md >> $GITHUB_STEP_SUMMARY

    - name: Upload HTML Test Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-html-report
        path: report.html
        retention-days: 7
